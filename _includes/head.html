  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:site_name" content="{{ site.title }}" />
  <link rel="shortcut icon" type="image/jpeg" href="{{ '/images/joby_qcrit.png' | relative_url }}">

  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}">

{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']]
    }
  };
</script>
<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>

<style>
  /* --- HEADER & FOOTER BACKGROUND --- */
  /* --- HEADER & FOOTER BACKGROUND --- */
  #footer .panel-footer,
  .navbar-default {
      background-color: #148F77 !important; /* Put your chosen hex code here! */
      border-color: #0E6655 !important;     /* Optional: Make this slightly darker than your main color */
      color: #ffffff !important;
  }

  /* --- TEXT & LINK COLORS --- */
  #footer .panel-footer a,
  .navbar-default .navbar-brand,
  .navbar-default .navbar-nav > li > a {
      color: #D1F2EB !important;
      text-shadow: none !important;
  }

  /* --- HOVER STATES --- */
  #footer .panel-footer a:hover,
  .navbar-default .navbar-brand:hover,
  .navbar-default .navbar-nav > li > a:hover {
      color: #ffffff !important;
      /*text-decoration: none !important;
      /* Adds a subtle glow to make the hover unmistakable */
      text-shadow: 0 0 2px rgba(255,255,255,0.5) !important;
  }

  /* --- MOBILE MENU BUTTON --- */
  .navbar-default .navbar-toggle {
      border-color: #A3E4D7 !important;
  }
  .navbar-default .navbar-toggle .icon-bar {
      background-color: #A3E4D7 !important;
  }
  .navbar-default .navbar-toggle:hover,
  .navbar-default .navbar-toggle:focus {
      background-color: #117864 !important;
  }
</style>

</head>
