
<div class="well">
  <h4 class="news-header">News</h4>

  {% for article in site.data.news limit:9 %}
  <div class="news-item">
    <span class="news-date">
      {{ article.date }}
    </span><br>
   
    <span class="news-headline">
      {{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}
    </span>
  </div>
  {% endfor %}

  <h5 class="news-footer">
    <a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a>
  </h5>
</div>
