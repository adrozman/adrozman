---
layout: default
---

<link rel="stylesheet" href="{{ '/css/github-markdown.css' | relative_url }}">

<div class="col-sm-12">

  <header class="post-header" style="margin-bottom: 30px;">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="text-muted">
      <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%b %-d, %Y" }}
      </time>

      {% if page.author %}
        <p class="text-muted" style="margin-top: 5px;">
        <span itemprop="author" itemscope itemtype="http://schema.org/Person">
          By <span itemprop="name">{{ page.author }}</span>
        </span>
      </p>
      {% endif %}
      
    </p>
  </header>

  <div class="post-content markdown-body" itemprop="articleBody" style="padding: 0; margin: 0; max-width: none;">
    {{ content }}
  </div>

</div>

<style>
  .output-box {
    background-color: #f6f8fa;
    border: 1px solid #d1d5da;
    border-left: 4px solid #586069;
    color: #24292e;
    padding: 8px 12px;
    margin-bottom: 20px;
    font-family: monospace;
    font-size: 0.85em;
    display: block;
  }
  
  /* 2. The "Output:" Label */
  .output-box::before {
      content: "Output: ";
      font-weight: bold;
      color: #6a737d;
      margin-right: 8px;
      user-select: none;
  }

  .post-content img {
    display: block;       /* Forces image to sit on its own line */
    margin-left: auto;    /* Pushes equally from the left */
    margin-right: auto;   /* Pushes equally from the right */
    max-width: 100%;      /* Prevents large images from overflowing */
  }

  .post-title {
    font-size: 3rem;           /* Keeps the title large and impactful */
    line-height: 1.1;          /* Tightens the vertical space between lines */
    text-wrap: balance;        /* The magic fix: evens out the line lengths */
    margin-bottom: 15px;       /* Gives it some breathing room */
    font-weight: 800;          /* Makes it bold and professional */
    letter-spacing: -0.02em;   /* Very slight tightening for better legibility */
}

</style>
