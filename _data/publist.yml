- title: "An Application of Amiet's Model for Turbulence Ingestion to eVTOL Propellers"
  image: joby_edgewise_qcrit_top.png
  description: An investigation of a hybrid prediction framework coupling CFD-derived turbulence statistics with Amiet's analytical model to predict the Turbulence Ingestion Noise of an eVTOL propeller in edgewise flight. The study compares turbulence parameters extracted from a high-fidelity simulation against a lower-cost actuator line model.
  authors: A. Rozman, A. Piccolo, S. Grace
  link:
    url: https://www.researchgate.net/publication/405088170_An_Application_of_Amiet's_Model_for_Turbulence_Ingestion_to_eVTOL_Propellers
    display: 32nd AIAA/CEAS Aeroacoustics Conference (2026)
  highlight: 1

- title: "Gradient-Enhanced Partitioned Gaussian Processes for Real-Time Quadrotor Dynamics Modeling"
  image: CHARM_workflow.png
  description: A novel gradient-enhanced Gaussian process approach to improve the accuracy and speed of quadrotor flight dynamics modeling, enabling high-fidelity real-time simulations. CHARM, a mid-fidelity rotorcraft solver was used to generate values and derivatives of forces, moments, and noise at thousands of operating points using Latin Hypercube Sampling to train this model.
  authors: L. Sang, A. Rozman, S. Grace, R. Tron
  link:
    url: https://arxiv.org/abs/2602.12487
    display: Preprint (Pending Publication)
  highlight: 1

- title: "Prediction of performance and noise of a small quadrotor using CHARM"
  image: endurance_OASPL_directivity.png
  description: A study utilizing CHARM, a mid-fidelity rotorcraft solver to predict the aerodynamic performance and acoustic signature of small-scale quadrotor vehicle. A parameter sensitivity study is presented and the best model results are validated against experimental benchmarks, capturing trends in performance but underpredicting downstream noise.
  authors: A. Rozman, E. Macrae-Sadek, M. Cable, D. Gardner, S. Grace
  link:
    url: https://www.researchgate.net/publication/399742531_Prediction_of_performance_and_noise_of_a_small_quadrotor_using_CHARM
    display: AIAA SciTech Forum (2026)
  highlight: 1

- title: "Evaluation of Urban-Flow-Informed Gusts on eVTOL Vertiport Approach Acoustics"
  image: palm_disturbance_spectrogram.png
  description: An investigation of how turbulent urban wind environments and gusts impact the noise levels of eVTOL aircraft during the critical approach phase to vertiports. ROAM, a actuator-line model within CREATE-AV Helios was used for computationally efficiency while resolving blade-vortex interaction for a gust with a timescale of tens of revolutions.
  authors: A. Rozman, S. Grace
  link:
    url: https://www.researchgate.net/publication/393766961_Evaluation_of_Urban-Flow-Informed_Gusts_on_eVTOL_Vertiport_Approach_Acoustics
    display: AIAA Aviation Forum (2025)
  highlight: 1

- title: "A Machine Learning Model for Rotor Blade Efficiency Prediction"
  image: FM_removed_pair_n=14.png
  description: Development of a machine learning framework designed to rapidly predict rotor blade efficiency, streamlining the design process for next-generation rotorcraft. RCAS, a mid-fidelity took was used to predict the performance for thousands of blades generated by perturbing parameterizations of 12 baseline geometries using Principal Component Analysis.
  authors: C. Hess, A. Rozman, P. Anusonthi-Inthra, R. Healy
  link:
    url: https://doi.org/10.2514/6.2025-3636
    display: AIAA Aviation Forum (2025)
  highlight: 1
  click_redirect_page: /pub_altpages/ml-rotor-efficiency/

- title: "Evaluating the Permeable Surface Approach for Wing-Propeller Aeroacoustics Using High-Fidelity CFD"
  image: AART_permeable_setup.png
  description: An evaluation of the permeable surface method in CFD for capturing complex aeroacoustic interactions between wings and propellers in distributed electric propulsion systems. An investigation of turbulence models and their laminar-to-turbulent transition extension models for this configuration is presented, exhibiting problems with the laminar-turbulence transition models for modeling a fully turbulent wing and a transitional flow propeller.
  authors: A. Rozman, Z. H. Jia, S. A. Tran, S. Grace
  link:
    url: https://www.bu.edu/ufmal/files/2024/03/Adam_TVF_2024.pdf
    display: VFS Aeromechanics Specialists' Conf (2024)
  highlight: 1

- title: "Investigating Ground Interactions of a Rotorcraft Landing Vehicle on Titan"
  image: dragonfly_brownout.png
  description: An undergraduate honors thesis exploring the unique aeromechanical challenges of landing a rotorcraft on Saturn's moon, Titan, focusing on ground-effect interactions. The propellers were modeled using actuator disk simplifications, and ground shear stress and two-phase particle kickup simulations were run.
  authors: A. Rozman
  link:
    url: https://stars.library.ucf.edu/honorstheses/1196
    display: Honors Undergraduate Thesis (2022)
  highlight: 1

