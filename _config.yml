# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Adam Rozman
email: admrozman@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  Adam Rozman is a PhD Candidate at Boston University specializing in aerodynamics and aeroacoustics modeling for multirotor vehicles.
baseurl: ""
image: /images/headshot.JPG
url: "https://adrozman.github.io"

include:
  - .htaccess
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  sass_dir: _sass

# Seo
logo: "/images/headshot.JPG" 
social:
  name: Adam Rozman
  links:
    - https://adrozman.github.io

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links
